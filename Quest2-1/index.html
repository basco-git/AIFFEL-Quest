<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>두더지 잡기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game" id="game" data-state="idle">
    <h1 class="title">두더지 잡기</h1>

    <section class="hud" aria-label="게임 정보">
      <div class="hud-box">
        <span class="hud-label">점수</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">남은 시간</span>
        <span class="hud-value"><span id="time">30</span>초</span>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">난이도를 고르고 시작을 눌러요</p>

    <div class="difficulty" role="group" aria-label="난이도 선택">
      <button type="button" class="diff-btn" data-level="easy" aria-pressed="false">쉬움</button>
      <button type="button" class="diff-btn" data-level="normal" aria-pressed="true">보통</button>
      <button type="button" class="diff-btn" data-level="hard" aria-pressed="false">어려움</button>
    </div>

    <div class="board" id="board" aria-label="게임판">
      <button type="button" class="cell" data-index="0" aria-label="1번 칸"></button>
      <button type="button" class="cell" data-index="1" aria-label="2번 칸"></button>
      <button type="button" class="cell" data-index="2" aria-label="3번 칸"></button>
      <button type="button" class="cell" data-index="3" aria-label="4번 칸"></button>
      <button type="button" class="cell" data-index="4" aria-label="5번 칸"></button>
      <button type="button" class="cell" data-index="5" aria-label="6번 칸"></button>
      <button type="button" class="cell" data-index="6" aria-label="7번 칸"></button>
      <button type="button" class="cell" data-index="7" aria-label="8번 칸"></button>
      <button type="button" class="cell" data-index="8" aria-label="9번 칸"></button>
    </div>

    <button type="button" class="start-btn" id="startBtn">시작</button>

    <section class="result" id="result" hidden>
      <p class="result-text" id="resultText">보통 모드 · 0점</p>
      <button type="button" class="restart-btn" id="restartBtn">다시하기</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
